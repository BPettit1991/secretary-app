<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SECRETARY // J.A.R.V.I.S</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#020608;--bg2:#050d12;--bg3:#071018;--bg4:#0a1520;--bg5:#0d1c2a;
  --cyan:#00d4ff;--cyan2:#00aacc;--cyan3:rgba(0,212,255,0.15);--cyan4:rgba(0,212,255,0.06);
  --red:#ff3b30;--red2:rgba(255,59,48,0.12);
  --gold:#ffd04a;--gold2:rgba(255,208,74,0.10);
  --green:#00ff88;--green2:rgba(0,255,136,0.10);
  --amber:#ff9500;--amber2:rgba(255,149,0,0.10);
  --purple:#bf5fff;--purple2:rgba(191,95,255,0.10);
  --t1:#e0f4ff;--t2:#5a9ab5;--t3:#2a5060;--t4:#16303d;
  --b1:rgba(0,212,255,0.10);--b2:rgba(0,212,255,0.20);--b3:rgba(0,212,255,0.35);
}
html,body,#root{height:100%;width:100%}
body{
  font-family:'Share Tech Mono',monospace;background:var(--bg);color:var(--t1);
  font-size:12px;line-height:1.5;overflow:hidden;
  background-image:linear-gradient(rgba(0,212,255,0.022) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.022) 1px,transparent 1px);
  background-size:40px 40px;
}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.02) 2px,rgba(0,0,0,0.02) 4px)}
.raj{font-family:'Rajdhani',sans-serif!important}
.shell{display:flex;height:100vh;width:100vw;overflow:hidden}

/* TICKER */
.ticker{height:24px;background:rgba(2,6,8,0.95);border-bottom:1px solid var(--b1);display:flex;align-items:center;overflow:hidden;flex-shrink:0}
.ticker-inner{display:flex;animation:tick 40s linear infinite;white-space:nowrap}
@keyframes tick{0%{transform:translateX(60vw)}100%{transform:translateX(-200%)}}
.ti{padding:0 24px;font-size:8.5px;letter-spacing:0.1em;color:var(--t3);border-right:1px solid var(--b1)}
.ti span{color:var(--cyan2)}

/* SIDEBAR */
.sidebar{width:232px;flex-shrink:0;background:linear-gradient(180deg,var(--bg2),var(--bg));border-right:1px solid var(--b1);display:flex;flex-direction:column;position:relative;overflow:hidden}
.sidebar::before{content:'';position:absolute;top:0;left:0;right:0;height:220px;background:radial-gradient(ellipse at 50% -10%,rgba(0,212,255,0.09),transparent 70%);pointer-events:none}

/* ARC REACTOR */
.reactor-wrap{padding:18px 16px 14px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:14px}
.reactor{position:relative;width:40px;height:40px;flex-shrink:0}
.r-ring{position:absolute;border-radius:50%;border:1px solid;animation:spin linear infinite}
.r1{inset:0;border-color:rgba(0,212,255,0.5);animation-duration:8s}
.r2{inset:5px;border-color:rgba(0,212,255,0.3);animation-duration:5s;animation-direction:reverse}
.r3{inset:10px;border-color:rgba(0,212,255,0.2);animation-duration:3s}
.r-core{position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle,var(--cyan),var(--cyan2));box-shadow:0 0 14px var(--cyan),0 0 28px rgba(0,212,255,0.3)}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.brand-text .bname{font-size:13px;font-weight:700;color:var(--cyan);letter-spacing:0.15em;text-transform:uppercase}
.brand-text .bsub{font-size:8.5px;color:var(--t3);letter-spacing:0.08em;margin-top:1px}
.bstatus{padding:0 16px 12px;display:flex;align-items:center;gap:6px;font-size:8.5px;color:var(--cyan2);letter-spacing:0.08em;border-bottom:1px solid var(--b1)}
.bpulse{width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan);animation:pulse 2s ease-in-out infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 6px var(--cyan)}50%{opacity:0.3;box-shadow:0 0 2px var(--cyan)}}

.nav{padding:8px 6px;flex:1}
.nitem{display:flex;align-items:center;gap:9px;padding:8px 10px;cursor:pointer;color:var(--t3);font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;transition:all 0.15s;border:none;background:none;width:100%;text-align:left;margin-bottom:2px;position:relative;clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,0 100%)}
.nitem:hover{color:var(--t2);background:var(--cyan4)}
.nitem.on{color:var(--cyan);background:var(--cyan4);border-left:2px solid var(--cyan);text-shadow:0 0 8px rgba(0,212,255,0.35)}
.nic{width:15px;text-align:center;font-size:12px;flex-shrink:0}
.nbadge{margin-left:auto;background:var(--amber2);color:var(--amber);border:1px solid rgba(255,149,0,0.3);font-size:8.5px;font-weight:700;padding:1px 6px;letter-spacing:0.04em}
.nbadge-r{margin-left:auto;background:var(--red2);color:var(--red);border:1px solid rgba(255,59,48,0.3);font-size:8.5px;font-weight:700;padding:1px 6px;letter-spacing:0.04em}

.machines{padding:10px 14px 6px;border-top:1px solid var(--b1)}
.mlabel{font-size:8px;font-weight:700;letter-spacing:0.18em;color:var(--t3);margin-bottom:8px;text-transform:uppercase}
.mrow{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.mdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.don{background:var(--green);box-shadow:0 0 7px var(--green)}
.dwarn{background:var(--amber);box-shadow:0 0 7px var(--amber)}
.doff{background:var(--t4)}
.mname{font-size:10px;color:var(--t2);flex:1;letter-spacing:0.05em}
.mst{font-size:8.5px;letter-spacing:0.04em}

/* MAIN */
.main{flex:1;overflow-y:auto;background:var(--bg);display:flex;flex-direction:column}
.main::-webkit-scrollbar{width:3px}
.main::-webkit-scrollbar-thumb{background:var(--b2)}
.main-inner{flex:1;overflow-y:auto}
.main-inner::-webkit-scrollbar{width:3px}
.main-inner::-webkit-scrollbar-thumb{background:var(--b2)}

/* PANEL */
.panel{background:var(--bg2);border:1px solid var(--b1);position:relative;overflow:hidden;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.panel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,212,255,0.35),transparent);pointer-events:none}
.pp{padding:14px 16px}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.phl{font-size:8px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;flex-shrink:0}
.phl-c{color:var(--cyan2)}.phl-r{color:var(--red)}.phl-g{color:var(--green)}.phl-a{color:var(--amber)}.phl-p{color:var(--purple)}.phl-gold{color:var(--gold)}
.ph-line{flex:1;height:1px;background:linear-gradient(90deg,var(--b1),transparent)}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 7px;font-size:8px;font-weight:700;border:1px solid;letter-spacing:0.08em;text-transform:uppercase;clip-path:polygon(0 0,calc(100% - 3px) 0,100% 3px,100% 100%,3px 100%,0 calc(100% - 3px))}
.bok{background:var(--green2);color:var(--green);border-color:rgba(0,255,136,0.3)}
.bwarn{background:var(--amber2);color:var(--amber);border-color:rgba(255,149,0,0.3)}
.boff{background:var(--bg4);color:var(--t3);border-color:var(--b1)}
.berr{background:var(--red2);color:var(--red);border-color:rgba(255,59,48,0.3)}
.bpur{background:var(--purple2);color:var(--purple);border-color:rgba(191,95,255,0.3)}
.bgold{background:var(--gold2);color:var(--gold);border-color:rgba(255,208,74,0.3)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;font-family:'Share Tech Mono',monospace;font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:all 0.15s;border:none;padding:7px 14px;clip-path:polygon(0 0,calc(100% - 5px) 0,100% 5px,100% 100%,5px 100%,0 calc(100% - 5px))}
.btn:active{transform:scale(0.97)}
.bp{background:rgba(0,212,255,0.12);color:var(--cyan);border:1px solid var(--b2);box-shadow:0 0 12px rgba(0,212,255,0.1)}
.bp:hover{background:rgba(0,212,255,0.2);box-shadow:0 0 20px rgba(0,212,255,0.25);text-shadow:0 0 8px var(--cyan)}
.bg{background:var(--bg3);border:1px solid var(--b1);color:var(--t2)}
.bg:hover{border-color:var(--b2);color:var(--t1)}
.bt{background:var(--bg3);border:1px solid var(--b1);color:var(--t2);font-size:8px;padding:5px 9px}
.bt:hover{border-color:var(--b2);color:var(--cyan)}
.btn-done{background:var(--green2);border:1px solid rgba(0,255,136,0.3);color:var(--green);font-size:8px;padding:5px 9px}
.btn-done:hover{background:rgba(0,255,136,0.18)}

.sbar{height:2px;background:var(--bg5);margin-top:4px;position:relative}
.sfill{height:100%;position:absolute;left:0;top:0}
.sfok{background:linear-gradient(90deg,var(--green),rgba(0,255,136,0.2));box-shadow:0 0 4px var(--green)}
.sfwarn{background:linear-gradient(90deg,var(--amber),rgba(255,149,0,0.2));box-shadow:0 0 4px var(--amber)}
.sferr{background:linear-gradient(90deg,var(--red),rgba(255,59,48,0.2));box-shadow:0 0 4px var(--red)}

/* ═══ TOAST NOTIFICATIONS ═══ */
.toast-stack{position:fixed;top:32px;right:16px;z-index:99999;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{
  display:flex;align-items:flex-start;gap:9px;padding:10px 13px;min-width:260px;max-width:320px;
  background:var(--bg2);border:1px solid var(--b2);
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));
  animation:toast-in 0.2s ease-out;
  pointer-events:all;
  position:relative;overflow:hidden;
}
.toast::after{content:'';position:absolute;bottom:0;left:0;height:2px;background:var(--toast-col,var(--cyan));animation:toast-progress var(--toast-dur,4s) linear forwards}
@keyframes toast-in{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes toast-progress{from{width:100%}to{width:0%}}
.toast-icon{font-size:12px;flex-shrink:0;margin-top:1px}
.toast-body{flex:1}
.toast-title{font-size:10px;color:var(--t1);letter-spacing:0.04em;margin-bottom:2px}
.toast-msg{font-size:8.5px;color:var(--t3);letter-spacing:0.03em;line-height:1.4}
.toast-close{font-size:9px;color:var(--t3);cursor:pointer;flex-shrink:0;padding:0 2px;line-height:1}
.toast-close:hover{color:var(--t1)}
.toast-out{animation:toast-out 0.18s ease-in forwards}
@keyframes toast-out{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(20px)}}

/* ═══ JARVIS COMMAND INTERFACE ═══ */
.jarvis-shell{display:flex;flex-direction:column;height:100%;padding:0}

/* Top HUD bar */
.hud-bar{
  display:flex;align-items:center;gap:20px;padding:10px 24px;
  border-bottom:1px solid var(--b1);
  background:linear-gradient(90deg,rgba(0,212,255,0.04),transparent);
  flex-shrink:0;
}
.hud-stat{text-align:center;flex-shrink:0}
.hud-num{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;line-height:1;color:var(--cyan);text-shadow:0 0 12px rgba(0,212,255,0.5)}
.hud-lbl{font-size:7.5px;color:var(--t3);letter-spacing:0.12em;text-transform:uppercase;margin-top:1px}
.hud-div{width:1px;height:36px;background:var(--b1);flex-shrink:0}
.hud-mid{flex:1;display:flex;align-items:center;justify-content:center;gap:16px}
.hud-ring{position:relative;width:50px;height:50px}
.hr-outer{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(0,212,255,0.3);animation:spin 10s linear infinite}
.hr-inner{position:absolute;inset:8px;border-radius:50%;border:1px solid rgba(0,212,255,0.2);animation:spin 6s linear infinite reverse}
.hr-core{position:absolute;inset:16px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,255,0.4),rgba(0,212,255,0.1));box-shadow:0 0 10px rgba(0,212,255,0.4)}

/* Conversation area */
.convo{flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:12px}
.convo::-webkit-scrollbar{width:3px}
.convo::-webkit-scrollbar-thumb{background:var(--b1)}

.msg-user{display:flex;justify-content:flex-end;gap:10px;align-items:flex-start}
.msg-jarvis{display:flex;justify-content:flex-start;gap:10px;align-items:flex-start}

.msg-avatar-user{
  width:26px;height:26px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,rgba(0,212,255,0.2),rgba(0,212,255,0.05));
  border:1px solid var(--b2);
  display:flex;align-items:center;justify-content:center;
  font-size:9px;color:var(--cyan);letter-spacing:0.05em;font-weight:700;
}
.msg-avatar-j{
  width:26px;height:26px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle,rgba(0,212,255,0.25),rgba(0,212,255,0.05));
  border:1px solid rgba(0,212,255,0.4);
  display:flex;align-items:center;justify-content:center;
  font-size:9px;color:var(--cyan);
  box-shadow:0 0 10px rgba(0,212,255,0.2);
  position:relative;
}
.msg-avatar-j::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:1px solid rgba(0,212,255,0.15);animation:spin 8s linear infinite}

.bubble-user{
  background:rgba(0,212,255,0.08);border:1px solid var(--b2);
  padding:9px 13px;max-width:60%;
  font-size:11px;color:var(--t1);letter-spacing:0.03em;line-height:1.5;
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%);
}
.bubble-jarvis{
  background:var(--bg2);border:1px solid var(--b1);
  padding:9px 13px;max-width:75%;
  font-size:11px;color:var(--t2);letter-spacing:0.03em;line-height:1.6;
  clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px);
  position:relative;overflow:hidden;
}
.bubble-jarvis::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--cyan2),transparent);opacity:0.3}
.bubble-jarvis strong{color:var(--cyan);font-weight:400}
.bubble-jarvis .action-list{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.action-row{display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--bg3);border:1px solid rgba(0,212,255,0.07);font-size:10px}
.action-row .aico{color:var(--green);font-size:10px}
.action-row .adone{color:var(--green);font-size:9px;margin-left:auto}
.action-row .apend{color:var(--amber);font-size:9px;margin-left:auto}
.msg-time{font-size:8px;color:var(--t3);letter-spacing:0.06em;margin-top:3px;text-align:right}
.msg-time-l{text-align:left}

/* Thinking indicator */
.thinking{display:flex;gap:4px;align-items:center;padding:4px 0}
.thdot{width:5px;height:5px;border-radius:50%;background:var(--cyan);animation:think 1.2s ease-in-out infinite}
.thdot:nth-child(2){animation-delay:0.2s}
.thdot:nth-child(3){animation-delay:0.4s}
@keyframes think{0%,100%{opacity:0.2;transform:scale(0.8)}50%{opacity:1;transform:scale(1.2);box-shadow:0 0 6px var(--cyan)}}

/* Quick commands */
.qcmds{padding:8px 24px;display:flex;gap:7px;flex-wrap:wrap;border-top:1px solid var(--b1);background:var(--bg);flex-shrink:0}
.qcmd{padding:5px 11px;border:1px solid var(--b1);background:var(--bg2);color:var(--t3);font-size:9px;letter-spacing:0.07em;text-transform:uppercase;cursor:pointer;transition:all 0.13s;font-family:'Share Tech Mono',monospace;clip-path:polygon(0 0,calc(100% - 5px) 0,100% 5px,100% 100%,0 100%)}
.qcmd:hover{border-color:var(--b2);color:var(--cyan);background:var(--cyan4)}

/* Command input */
.cmd-bar{
  padding:12px 24px 14px;border-top:1px solid var(--b2);
  background:linear-gradient(0deg,rgba(0,212,255,0.04),transparent);
  flex-shrink:0;
}
.cmd-input-row{display:flex;align-items:center;gap:10px}
.cmd-prompt{font-size:12px;color:var(--cyan);letter-spacing:0.05em;flex-shrink:0;text-shadow:0 0 8px rgba(0,212,255,0.5)}
.cmd-input{
  flex:1;background:transparent;border:none;outline:none;
  font-size:13px;color:var(--t1);font-family:'Share Tech Mono',monospace;
  letter-spacing:0.04em;caret-color:var(--cyan);
}
.cmd-input::placeholder{color:var(--t3)}
.cmd-line{height:1px;background:linear-gradient(90deg,var(--b2),transparent);margin-top:8px}
.cmd-hints{display:flex;gap:16px;margin-top:6px}
.cmd-hint{font-size:8px;color:var(--t3);letter-spacing:0.08em}
.cmd-hint span{color:var(--t2)}

/* ── SIDE PANELS overlay when on desk ── */
.desk-layout{display:grid;grid-template-columns:1fr 260px;gap:0;height:100%}
.desk-side{border-left:1px solid var(--b1);display:flex;flex-direction:column;overflow:hidden}
.side-panel{border-bottom:1px solid var(--b1);flex-shrink:0}
.side-scroll{flex:1;overflow-y:auto}
.side-scroll::-webkit-scrollbar{width:2px}
.side-scroll::-webkit-scrollbar-thumb{background:var(--b1)}

.drow{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid rgba(0,212,255,0.04);gap:8px;cursor:pointer;transition:all 0.1s}
.drow:last-child{border-bottom:none}
.drow:hover{background:var(--cyan4);margin:0 -4px;padding-left:4px;padding-right:4px}
.fname{font-size:10.5px;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:0.02em;flex:1}
.fmeta{font-size:8.5px;color:var(--t3);letter-spacing:0.04em;white-space:nowrap}

.feed-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid rgba(0,212,255,0.04)}
.feed-item:last-child{border-bottom:none}
.feed-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:4px}
.feed-txt{font-size:9.5px;color:var(--t2);flex:1;line-height:1.4;letter-spacing:0.02em}
.feed-time{font-size:8px;color:var(--t3);white-space:nowrap}

/* Stats row */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 14px;border-bottom:1px solid var(--b1)}
.stat-tile{text-align:center}
.stat-num{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;line-height:1}
.stat-lbl{font-size:7.5px;color:var(--t3);letter-spacing:0.1em;text-transform:uppercase}

/* ── BRIEFING ── */
.b-shell{padding:22px 26px;height:100%;display:flex;flex-direction:column;gap:14px}
.greeting{font-family:'Rajdhani',sans-serif;font-size:46px;font-weight:700;letter-spacing:-1px;line-height:1;color:var(--t1)}
.g-name{color:transparent;background:linear-gradient(90deg,var(--cyan),#80e8ff);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 16px rgba(0,212,255,0.4))}
.g-sub{font-size:8.5px;color:var(--t3);letter-spacing:0.15em;margin-top:5px;text-transform:uppercase}
.b-grid{display:grid;grid-template-columns:1fr 290px;grid-template-rows:auto auto;gap:12px;flex:1;min-height:0}
.b-cal{grid-column:1;grid-row:1}
.b-attn{grid-column:2;grid-row:1/3}
.b-focus{grid-column:1;grid-row:2}
.cal-row{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid rgba(0,212,255,0.06)}
.cal-row:last-child{border-bottom:none}
.cal-time{width:44px;flex-shrink:0;font-size:10px;color:var(--cyan2)}
.cal-bar{width:2px;height:22px;background:linear-gradient(180deg,var(--cyan),transparent);flex-shrink:0;margin-right:12px;box-shadow:0 0 5px var(--cyan)}
.cal-title{flex:1;font-size:12px;color:var(--t1);font-family:'Rajdhani',sans-serif;font-weight:500}

// ── TOAST SYSTEM ──
let _toastId=0;
function useToasts(){
  const [toasts,setToasts]=useState([]);
  const add=useCallback((title,msg,type='info',dur=4000)=>{
    const id=++_toastId;
    setToasts(t=>[...t,{id,title,msg,type,dur,out:false}]);
    setTimeout(()=>setToasts(t=>t.map(x=>x.id===id?{...x,out:true}:x)),dur-200);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),dur+200);
    return id;
  },[]);
  const dismiss=useCallback((id)=>{
    setToasts(t=>t.map(x=>x.id===id?{...x,out:true}:x));
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),200);
  },[]);
  return{toasts,add,dismiss};
}

const TOAST_ICONS={info:'◈',success:'✓',warning:'⚠',error:'✕'};
const TOAST_COLS={info:'var(--cyan)',success:'var(--green)',warning:'var(--amber)',error:'var(--red)'};

function ToastStack({toasts,dismiss}){
  return(
    <div className="toast-stack">
      {toasts.map(({id,title,msg,type,dur,out})=>(
        <div key={id} className={`toast${out?' toast-out':''}`}
          style={{'--toast-col':TOAST_COLS[type],'--toast-dur':`${dur}ms`}}>
          <div className="toast-icon" style={{color:TOAST_COLS[type]}}>{TOAST_ICONS[type]}</div>
          <div className="toast-body">
            <div className="toast-title">{title}</div>
            {msg&&<div className="toast-msg">{msg}</div>}
          </div>
          <div className="toast-close" onClick={()=>dismiss(id)}>✕</div>
        </div>
      ))}
    </div>
  );
}

function TypeWriter({text,onDone}){
  const [shown,setShown]=useState('');
  const [done,setDone]=useState(false);
  useEffect(()=>{
    setShown('');setDone(false);
    let i=0;
    const raw=text.replace(/<[^>]+>/g,'');
    const speed=raw.length>300?10:16;
    const interval=setInterval(()=>{
      i++;
      setShown(text.slice(0,i));
      if(i>=text.length){clearInterval(interval);setDone(true);if(onDone)onDone()}
    },speed);
    return()=>clearInterval(interval);
  },[text]);
  return <span dangerouslySetInnerHTML={{__html:shown+(done?'':'▋')}}/>;
}

const CTX_META={c:{label:'Complihaus',cls:'tk-ctx-c'},d:{label:'Day Job',cls:'tk-ctx-d'},p:{label:'Personal',cls:'tk-ctx-p'}};
const PRI_META={h:{label:'HIGH',cls:'tk-pri-h'},m:{label:'MED',cls:'tk-pri-m'},l:{label:'LOW',cls:'tk-pri tk-pri-l'}};
const DUE_SOON=['TODAY','TONIGHT','FRI 06 JUN'];

function Tasks({notify,liveTasks,loading}){
  const [tasks,setTasks]=useState(INIT_TASKS);
  // Swap to live tasks once loaded
  const [usedLive,setUsedLive]=useState(false);
  useEffect(()=>{
    if(liveTasks&&!usedLive){setTasks(liveTasks);setUsedLive(true);}
  },[liveTasks]);
  const toggle=(id)=>{
    setTasks(t=>t.map(x=>{
      if(x.id!==id)return x;
      const next={...x,done:!x.done};
      if(next.done)notify('Task complete',next.title,'success',3500);
      return next;
    }));
  };

  const cols=[
    {key:'todo',label:'To Do',items:tasks.filter(t=>!t.done)},
    {key:'done',label:'Done',items:tasks.filter(t=>t.done)},
  ];

  const high=tasks.filter(t=>!t.done&&t.pri==='h');
  const byCtx=(ctx)=>tasks.filter(t=>!t.done&&t.ctx===ctx);

  return(
    <div className="tk-shell" style={{overflow:'hidden'}}>
      <div className="tk-header">
        <div style={{fontFamily:'Rajdhani',fontSize:24,fontWeight:700,letterSpacing:'0.04em'}}>Tasks</div>
        <div style={{fontSize:9,color:'var(--t3)',letterSpacing:'0.1em',textTransform:'uppercase'}}>
          {tasks.filter(t=>!t.done).length} open · {tasks.filter(t=>t.done).length} done · {high.length} high priority
        </div>
        <div style={{marginLeft:'auto',display:'flex',gap:7}}>
          {[['c','Complihaus',byCtx('c').length],['d','Day Job',byCtx('d').length],['p','Personal',byCtx('p').length]].map(([k,l,n])=>(
            <div key={k} style={{display:'flex',alignItems:'center',gap:5}}>
              <span className={`tk-ctx ${CTX_META[k].cls}`}>{l}</span>
              <span style={{fontSize:9,color:'var(--t3)'}}>{n}</span>
            </div>
          ))}
        </div>
      </div>

      <div style={{flex:1,overflowY:'auto',display:'grid',gridTemplateColumns:'2fr 1fr',gap:14,alignContent:'start'}}>
        {/* Open tasks — grouped by context */}
        <div>
          {['c','d','p'].map(ctx=>{
            const items=tasks.filter(t=>!t.done&&t.ctx===ctx);
            if(!items.length)return null;
            return(
              <div key={ctx} style={{marginBottom:18}}>
                <div className="tk-col-head">
                  <span className={`tk-ctx ${CTX_META[ctx].cls}`}>{CTX_META[ctx].label}</span>
                  <span className="tk-col-count">{items.length} tasks</span>
                </div>
                {items.map(task=>(
                  <div key={task.id} className="tk-card">
                    <div className="tk-title">{task.title}</div>
                    <div className="tk-meta">
                      <span className={`tk-pri ${PRI_META[task.pri].cls}`}>{PRI_META[task.pri].label}</span>
                      {task.due&&<span className={`tk-due ${DUE_SOON.includes(task.due)?'tk-due-soon':'tk-due-ok'}`}>{task.due}</span>}
                    </div>
                    <div className="tk-actions">
                      <button className="btn-done btn" style={{fontSize:8,padding:'4px 9px'}} onClick={()=>toggle(task.id)}>Mark done</button>
                      <button className="bt btn" style={{fontSize:8,padding:'4px 9px'}} onClick={()=>window.open('https://to-do.office.com/tasks/','_blank')}>Open To-Do</button>
                    </div>
                  </div>
                ))}
              </div>
            );
          })}
        </div>

        {/* Done + summary */}
        <div>
          <div style={{marginBottom:18}}>
            <Panel className="pp" style={{marginBottom:14}}>
              <PH label="// Priority Queue" col="r"/>
              {high.slice(0,4).map(t=>(
                <div key={t.id} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 0',borderBottom:'1px solid rgba(0,212,255,0.05)'}}>
                  <div style={{width:5,height:5,borderRadius:'50%',background:'var(--red)',boxShadow:'0 0 5px var(--red)',flexShrink:0}}/>
                  <div style={{flex:1,fontSize:9.5,color:'var(--t1)',letterSpacing:'0.02em',lineHeight:1.3}}>{t.title}</div>
                  {t.due&&<div style={{fontSize:8,color:DUE_SOON.includes(t.due)?'var(--red)':'var(--t3)',whiteSpace:'nowrap'}}>{t.due}</div>}
                </div>
              ))}
            </Panel>
          </div>

          {tasks.filter(t=>t.done).length>0&&(
            <div>
              <div className="tk-col-head">
                <span style={{fontSize:10,color:'var(--green)',letterSpacing:'0.1em',textTransform:'uppercase',fontWeight:700}}>// Completed</span>
                <span className="tk-col-count">{tasks.filter(t=>t.done).length} tasks</span>
              </div>
              {tasks.filter(t=>t.done).map(task=>(
                <div key={task.id} className="tk-card done">
                  <div className="tk-title">{task.title}</div>
                  <div className="tk-meta">
                    <span className={`tk-ctx ${CTX_META[task.ctx].cls}`}>{CTX_META[task.ctx].label}</span>
                    <button className="bt btn" style={{fontSize:8,padding:'3px 7px',marginLeft:'auto'}} onClick={()=>toggle(task.id)}>Undo</button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function useData(){
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(true);
  const [connected,setConnected]=useState(true);
  const [error,setError]=useState(null);
  useEffect(()=>{
    fetch('/api/data')
      .then(r=>{
        if(r.status===401){setConnected(false);setLoading(false);return null;}
        return r.json();
      })
      .then(d=>{
        if(!d)return;
        if(d.error){setError(d.error);return;}
        setData(d);
      })
      .catch(e=>setError(e.message))
      .finally(()=>setLoading(false));
  },[]);
  return{data,loading,connected,error};
}

function formatDue(isoDate){
  if(!isoDate)return null;
  const d=new Date(isoDate);
  const today=new Date();today.setHours(0,0,0,0);
  const diff=Math.round((d-today)/(1000*60*60*24));
  if(diff<0)return'OVERDUE';
  if(diff===0)return'TODAY';
  if(diff===1)return'TOMORROW';
  if(diff<=6)return d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}).toUpperCase();
  return d.toLocaleDateString('en-AU',{day:'numeric',month:'short'}).toUpperCase();
}

function formatEventTime(iso,isAllDay){
  if(isAllDay)return'All day';
  const d=new Date(iso);
  return d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',hour12:false});
}

function mapImportance(imp){
  if(imp==='high')return'h';
  if(imp==='low')return'l';
  return'm';
}

function mapListToCtx(listName){
  const n=(listName||'').toLowerCase();
  if(n.includes('complihaus')||n.includes('rc')||n.includes('compliance'))return'c';
  if(n.includes('day job')||n.includes('work')||n.includes('dayjob'))return'd';
  return'p';
}

function ConnectScreen({onConnected}){
  const [phase,setPhase]=useState('idle'); // idle | loading | waiting | error | done
  const [code,setCode]=useState('');
  const [url,setUrl]=useState('');
  const [errMsg,setErrMsg]=useState('');
  const pollRef=useRef(null);

  const start=async()=>{
    setPhase('loading');
    try{
      const r=await fetch('/api/setup');
      const d=await r.json();
      if(d.error){setErrMsg(d.error);setPhase('error');return;}
      setCode(d.user_code);
      setUrl(d.verification_uri);
      setPhase('waiting');
      // Copy code to clipboard automatically
      try{await navigator.clipboard.writeText(d.user_code);}catch(e){}
      // Start polling
      const interval=((d.interval||5)+1)*1000;
      pollRef.current=setInterval(async()=>{
        const pr=await fetch('/api/poll',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_code:d.device_code})});
        const pd=await pr.json();
        if(pd.status==='ok'){
          clearInterval(pollRef.current);
          setPhase('done');
          setTimeout(()=>onConnected(),800);
        } else if(pd.status==='expired'){
          clearInterval(pollRef.current);
          setErrMsg('Code expired. Try again.');
          setPhase('error');
        } else if(pd.status==='error'){
          clearInterval(pollRef.current);
          setErrMsg(pd.message||'Auth failed');
          setPhase('error');
        }
      },interval);
    }catch(e){setErrMsg(e.message);setPhase('error');}
  };

  useEffect(()=>()=>{if(pollRef.current)clearInterval(pollRef.current)},[]);

  return(
    <div style={{height:'100vh',width:'100vw',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)',flexDirection:'column',gap:20,
      backgroundImage:'linear-gradient(rgba(0,212,255,0.022) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.022) 1px,transparent 1px)',backgroundSize:'40px 40px'}}>

      {/* Reactor */}
      <div style={{position:'relative',width:64,height:64,marginBottom:8}}>
        {[0,1,2].map(i=>(
          <div key={i} style={{position:'absolute',inset:i*10,borderRadius:'50%',border:'1px solid rgba(0,212,255,'+(0.5-i*0.15)+')',animation:`spin ${8-i*2}s linear infinite`}}/>
        ))}
        <div style={{position:'absolute',inset:22,borderRadius:'50%',background:'radial-gradient(circle,var(--cyan),var(--cyan2))',boxShadow:'0 0 18px var(--cyan)',opacity:phase==='done'?1:0.7}}/>
      </div>

      <div style={{fontFamily:'Rajdhani',fontSize:28,fontWeight:700,color:'var(--cyan)',letterSpacing:'0.12em'}}>SECRETARY</div>

      {phase==='idle'&&(
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:9,color:'var(--t3)',letterSpacing:'0.18em',textTransform:'uppercase',marginBottom:24}}>Microsoft 365 not connected</div>
          <button className="btn bp" style={{fontSize:11,padding:'11px 28px'}} onClick={start}>◈ &nbsp;Connect Microsoft 365</button>
          <div style={{marginTop:14,fontSize:8.5,color:'var(--t3)',letterSpacing:'0.06em',lineHeight:1.9}}>
            Signs in with your Microsoft account · no passwords stored<br/>
            Calendar · To-Do tasks · OneDrive storage
          </div>
        </div>
      )}

      {phase==='loading'&&(
        <div style={{fontSize:9,color:'var(--t3)',letterSpacing:'0.14em',textTransform:'uppercase'}}>
          <div className="thinking" style={{justifyContent:'center'}}><div className="thdot"/><div className="thdot"/><div className="thdot"/></div>
        </div>
      )}

      {phase==='waiting'&&(
        <div style={{textAlign:'center',maxWidth:360}}>
          <div style={{fontSize:9,color:'var(--t3)',letterSpacing:'0.14em',textTransform:'uppercase',marginBottom:16}}>Step 1 — visit this URL in your browser</div>
          <a href={url} target="_blank" rel="noreferrer"
            style={{display:'block',padding:'10px 18px',background:'var(--bg2)',border:'1px solid var(--b2)',color:'var(--cyan)',fontFamily:"'Share Tech Mono',monospace",fontSize:11,letterSpacing:'0.06em',textDecoration:'none',marginBottom:20}}>
            {url} ↗
          </a>
          <div style={{fontSize:9,color:'var(--t3)',letterSpacing:'0.14em',textTransform:'uppercase',marginBottom:10}}>Step 2 — enter this code</div>
          <div style={{fontFamily:'Rajdhani',fontSize:40,fontWeight:700,letterSpacing:'0.25em',color:'var(--cyan)',textShadow:'0 0 20px rgba(0,212,255,0.5)',background:'var(--bg2)',border:'1px solid var(--b2)',padding:'14px 28px',marginBottom:12}}>
            {code}
          </div>
          <div style={{fontSize:8,color:'var(--green)',letterSpacing:'0.1em',marginBottom:20}}>✓ Code copied to clipboard</div>
          <div style={{display:'flex',alignItems:'center',gap:8,justifyContent:'center',fontSize:9,color:'var(--t3)',letterSpacing:'0.1em'}}>
            <div className="thinking"><div className="thdot"/><div className="thdot"/><div className="thdot"/></div>
            WAITING FOR SIGN-IN...
          </div>
        </div>
      )}

      {phase==='done'&&(
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:24,color:'var(--green)',marginBottom:8}}>✓</div>
          <div style={{fontSize:10,color:'var(--green)',letterSpacing:'0.12em',textTransform:'uppercase'}}>Connected — loading your data</div>
        </div>
      )}

      {phase==='error'&&(
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:9,color:'var(--red)',letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:16}}>{errMsg}</div>
          <button className="btn bp" style={{fontSize:10,padding:'8px 20px'}} onClick={()=>{setPhase('idle');setErrMsg('');}}>Try again</button>
        </div>
      )}
    </div>
  );
}

function App(){
  const [v,setV]=useState('desk');
  const {toasts,add:notify,dismiss}=useToasts();
  const {data,loading,connected,error}=useData();

  useEffect(()=>{
    if(error){
      notify('API unavailable','Running on demo data — check Vercel env vars','warning',6000);
    }
  },[error]);

  useEffect(()=>{
    if(!data)return;
    const gb=n=>Math.round(n/1073741824);
    const rem=gb(data.storage?.remaining||0);
    if(rem<100)notify(`OneDrive: ${gb(data.storage?.used||0)} GB used`,'','info',4000);
    const highTasks=(data.tasks||[]).filter(t=>t.importance==='high').length;
    if(highTasks>0)notify(`${highTasks} high-priority task${highTasks>1?'s':''} open`,'','warning',4500);
  },[data]);

  // Normalise live tasks into the same shape Tasks component uses
  const liveTasks=data?data.tasks.map((t,i)=>({
    id:t.id||i,
    title:t.title,
    ctx:mapListToCtx(t.list),
    pri:mapImportance(t.importance),
    due:formatDue(t.due),
    done:false,
    notionUrl:null,
  })):null;

  // Today's calendar events
  const todayEvents=data?data.calendar.filter(e=>{
    const d=new Date(e.start);
    const today=new Date();
    return d.getDate()===today.getDate()&&d.getMonth()===today.getMonth();
  }):null;

  // Storage in GB
  const gb=n=>Math.round((n||0)/1073741824);
  const storage=data?{
    used:gb(data.storage.used),
    total:gb(data.storage.total),
    remaining:gb(data.storage.remaining),
  }:null;

  const views={
    briefing:<Briefing go={setV} events={todayEvents} loading={loading}/>,
    desk:<JarvisDesk go={setV} notify={notify} storage={storage}/>,
    inbox:<Inbox go={setV}/>,
    filemap:<FileMap storage={storage}/>,
    automations:<Automations/>,
    tasks:<Tasks notify={notify} liveTasks={liveTasks} loading={loading}/>,
  };

  const taskCount=liveTasks?liveTasks.filter(t=>t.pri==='h').length:INIT_TASKS.filter(t=>!t.done&&t.pri==='h').length;

  if(!connected){
    return <ConnectScreen onConnected={()=>window.location.reload()}/>;
  }

  return(
    <div className="shell">
      <ToastStack toasts={toasts} dismiss={dismiss}/>
      <aside className="sidebar">
        <div className="reactor-wrap">
          <div className="reactor">
            <div className="r-ring r1"/><div className="r-ring r2"/><div className="r-ring r3"/>
            <div className="r-core"/>
          </div>
          <div className="brand-text">
            <div className="bname">Secretary</div>
            <div className="bsub">blackbetty · sys v2.1</div>
          </div>
        </div>
        <div className="bstatus"><div className="bpulse"/><Clock/>&nbsp;·&nbsp;SYSTEMS ONLINE</div>
        <nav className="nav">
          {[
            {id:'briefing',ic:'◈',lb:'Morning Brief'},
            {id:'desk',ic:'⊞',lb:'Command Desk'},
            {id:'inbox',ic:'⬡',lb:'Inbox',n:7},
            {id:'tasks',ic:'◧',lb:'Tasks',nr:taskCount},
            {id:'filemap',ic:'◉',lb:'File Map'},
            {id:'automations',ic:'⚙',lb:'Automations'},
          ].map(({id,ic,lb,n,nr})=>(
            <button key={id} className={`nitem${v===id?' on':''}`} onClick={()=>setV(id)}>
              <span className="nic">{ic}</span>{lb}
              {n&&<span className="nbadge">{n}</span>}
              {nr&&<span className="nbadge-r">{nr}</span>}
            </button>
          ))}
        </nav>
        <div className="machines">
          <div className="mlabel">// Connected Nodes</div>
          {[
            {c:'don',n:'MAIN-LAP',st:'ONLINE',sc:'var(--green)'},
            {c:'dwarn',n:'BLACKBETTY',st:'STORAGE LOW',sc:'var(--amber)'},
            {c:'doff',n:'TERTIARY',st:'OFFLINE',sc:'var(--t3)',dim:true},
          ].map(({c,n,st,sc,dim})=>(
            <div key={n} className="mrow"><Dot c={c}/><span className="mname" style={dim?{color:'var(--t3)'}:{}}>{n}</span><span className="mst" style={{color:sc}}>{st}</span></div>
          ))}
        </div>
      </aside>
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div className="ticker">
          <div className="ticker-inner">
            {[...TICKER_ITEMS,...TICKER_ITEMS].map(({l,v},i)=>(
              <div key={i} className="ti">{l}: <span>{v}</span></div>
            ))}
          </div>
        </div>
        <div style={{flex:1,overflow:'hidden'}}>
          {views[v]}
        </div>
      </div>
    </div>
  );
}
